name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --engine-strict
      - run: npm run check:dependencies
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
      - name: Check the FIELDWORK showcase
        run: CHROME="$(node -p 'require("playwright").chromium.executablePath()')" node examples/fieldwork/check.mjs
      - run: npx --no-install tsc --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext evals/run-ui.ts tests/planning-focus.test.ts scripts/import-official.ts scripts/refresh-cache.ts scripts/refresh-resources.ts scripts/m3-resources/index.ts scripts/m3-resources/probe.ts scripts/build-knowledge.ts
      - run: npm run evals
      - run: npm run smoke
      - run: npm run evals:ui
      - run: docker build -t material-superpowers-mcp:local .
      - run: npm run smoke -- --docker
